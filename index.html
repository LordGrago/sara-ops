<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sara Ops</title>
  <link rel="stylesheet" href="shared/styles/tokens.css">
  <link rel="stylesheet" href="shared/styles/base.css">
  <style>
    /* Sidebar */
    #sidebar { padding: var(--space-6) 0; }

    .sidebar-logo {
      padding: 0 var(--space-5) var(--space-6);
      border-bottom: 1px solid var(--color-border);
      margin-bottom: var(--space-4);
    }
    .sidebar-logo-name {
      font-family: var(--font-display);
      font-size: var(--text-md);
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--color-text);
    }
    .sidebar-logo-sub {
      font-size: var(--text-xs);
      color: var(--color-text-hint);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Nav sections */
    .nav-section { padding: 0 var(--space-3); margin-bottom: var(--space-4); }
    .nav-label {
      font-size: var(--text-xs);
      color: var(--color-text-hint);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: var(--space-2) var(--space-2) var(--space-1);
      display: block;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-decoration: none;
      transition: all var(--transition-fast);
    }
    .nav-link:hover, .nav-link.active {
      background: var(--color-bg-muted);
      color: var(--color-text);
    }
    .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.6; }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-8);
    }

    /* Module grid */
    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--space-4);
    }
  </style>
</head>
<body>

<nav id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-name">Sara Vinitz</div>
    <div class="sidebar-logo-sub">Operations</div>
  </div>

  <div class="nav-section">
    <span class="nav-label">Core</span>
    <a class="nav-link active" href="index.html">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="5" height="5" rx="1" fill="currentColor"/><rect x="9" y="2" width="5" height="5" rx="1" fill="currentColor" opacity=".5"/><rect x="2" y="9" width="5" height="5" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="9" width="5" height="5" rx="1" fill="currentColor" opacity=".5"/></svg>
      Dashboard
    </a>
    <a class="nav-link" href="modules/brand-filter/index.html">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none"><path d="M8 2L9.5 6.5H14L10.5 9L11.5 14L8 11.5L4.5 14L5.5 9L2 6.5H6.5L8 2Z" fill="currentColor" opacity=".7"/></svg>
      Brand filter
    </a>
  </div>

  <div class="nav-section">
    <span class="nav-label">Planning</span>
    <a class="nav-link" href="modules/projects/index.html">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="3" rx="1" fill="currentColor" opacity=".7"/><rect x="2" y="7" width="9" height="2" rx="1" fill="currentColor" opacity=".5"/><rect x="2" y="11" width="6" height="2" rx="1" fill="currentColor" opacity=".3"/></svg>
      Projects
    </a>
    <a class="nav-link" href="modules/task-map/index.html">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="2" height="2" rx=".5" fill="currentColor"/><rect x="6" y="3" width="8" height="2" rx="1" fill="currentColor" opacity=".5"/><rect x="2" y="7" width="2" height="2" rx=".5" fill="currentColor"/><rect x="6" y="7" width="6" height="2" rx="1" fill="currentColor" opacity=".5"/><rect x="2" y="11" width="2" height="2" rx=".5" fill="currentColor"/><rect x="6" y="11" width="5" height="2" rx="1" fill="currentColor" opacity=".5"/></svg>
      Task map
    </a>
    <a class="nav-link" href="modules/content-plan/index.html">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.2" opacity=".6"/><line x1="5" y1="2" x2="5" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="2" x2="11" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="2" y1="7" x2="14" y2="7" stroke="currentColor" stroke-width="1" opacity=".4"/></svg>
      Content plan
    </a>
  </div>

  <div class="nav-section">
    <span class="nav-label">Production</span>
    <a class="nav-link" href="modules/film-projects/index.html">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none"><rect x="1" y="4" width="14" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2" opacity=".6"/><path d="M6.5 7L10 9.5L6.5 12V7Z" fill="currentColor" opacity=".6"/><rect x="1" y="2" width="2" height="3" rx=".5" fill="currentColor" opacity=".4"/><rect x="4.5" y="2" width="2" height="3" rx=".5" fill="currentColor" opacity=".4"/><rect x="8" y="2" width="2" height="3" rx=".5" fill="currentColor" opacity=".4"/><rect x="11.5" y="2" width="2" height="3" rx=".5" fill="currentColor" opacity=".4"/></svg>
      Film projects
    </a>
    <a class="nav-link" href="modules/website-builder/index.html">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.2" opacity=".6"/><rect x="3" y="5.5" width="4" height="5" rx=".5" fill="currentColor" opacity=".3"/><rect x="9" y="5.5" width="4" height="2" rx=".5" fill="currentColor" opacity=".3"/><rect x="9" y="9" width="3" height="1.5" rx=".5" fill="currentColor" opacity=".3"/></svg>
      Website builder
    </a>
    <a class="nav-link" href="modules/gallery-3d/index.html">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none"><path d="M8 2L14 5.5V10.5L8 14L2 10.5V5.5L8 2Z" stroke="currentColor" stroke-width="1.2" opacity=".6"/><path d="M8 2V14M2 5.5L14 10.5" stroke="currentColor" stroke-width=".8" opacity=".3"/></svg>
      Gallery 3D
    </a>
    <a class="nav-link" href="modules/art-projects/index.html">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.2" opacity=".6"/><circle cx="5.5" cy="6.5" r="1.5" fill="currentColor" opacity=".4"/><circle cx="10.5" cy="6" r="1" fill="currentColor" opacity=".4"/><circle cx="9" cy="10" r="1.5" fill="currentColor" opacity=".4"/></svg>
      Art projects
    </a>
  </div>
</nav>

<main id="main">
  <div class="page-header">
    <h1>Dashboard</h1>
    <p>All directions of Sara's work in one place.</p>
  </div>

  <div class="stats-row">
    <sara-stat id="stat-projects" label="Active projects" accent="var(--color-lime)"></sara-stat>
    <sara-stat id="stat-tasks"    label="Open tasks"      accent="var(--color-lavender)"></sara-stat>
    <sara-stat id="stat-content"  label="Content this week" accent="var(--lime-700)"></sara-stat>
    <sara-stat id="stat-blocked"  label="Blocked"         accent="var(--color-hotpink)"></sara-stat>
  </div>

  <div class="module-grid">
    <sara-card
      heading="Brand filter"
      description="Sara's postulates. Paste any text to check it against brand values and voice principles."
      accent="var(--color-lime)"
      href="modules/brand-filter/index.html">
    </sara-card>

    <sara-card
      heading="Projects"
      description="All active directions: website, films, art projects, content, strategy. Phases and statuses."
      accent="var(--color-lavender)"
      href="modules/projects/index.html">
    </sara-card>

    <sara-card
      heading="Task map"
      description="Every task with its owner. Kanban + table view. Blocked items surface automatically."
      accent="var(--color-hotpink)"
      href="modules/task-map/index.html">
    </sara-card>

    <sara-card
      heading="Content plan"
      description="Calendar of posts, reels, Telegram articles. Assignees, pillars, approval queue for Sara."
      accent="var(--lime-700)"
      href="modules/content-plan/index.html">
    </sara-card>

    <sara-card
      heading="Film projects"
      description="Documentary interview pipeline: shoot → edit → social cuts → publish."
      accent="var(--neutral-400)"
      href="modules/film-projects/index.html">
    </sara-card>

    <sara-card
      heading="Website builder"
      description="Section cards for Sara's public site. Build architecture before implementing."
      accent="var(--lavender-700)"
      href="modules/website-builder/index.html">
    </sara-card>

    <sara-card
      heading="Gallery 3D"
      description="Isometric editor for virtual gallery spaces. Draw → render → embed on the website."
      accent="var(--hotpink-300)"
      href="modules/gallery-3d/index.html">
    </sara-card>

    <sara-card
      heading="Art projects"
      description="Standalone art projects: pop-up galleries, tapestries, carpets, digital library."
      accent="var(--color-lime)"
      href="modules/art-projects/index.html">
    </sara-card>
  </div>
</main>

<script type="module">
  import { store } from './shared/utils/store.js';
  import './shared/components/sara-stat.js';
  import './shared/components/sara-card.js';

  // Loads stats and populates sara-stat components reactively
  async function loadStats() {
    try {
      const [projects, tasks, content] = await Promise.all([
        store.load('projects'),
        store.load('tasks'),
        store.load('content'),
      ]);

      const active  = projects.filter(p => p.status === 'active').length;
      const open    = tasks.filter(t => t.status !== 'done').length;
      const blocked = tasks.filter(t => t.status === 'blocked').length;

      const now  = new Date();
      const wEnd = new Date(now); wEnd.setDate(now.getDate() + 7);
      const week = content.filter(c => {
        if (!c.publish_date) return false;
        const d = new Date(c.publish_date);
        return d >= now && d <= wEnd;
      }).length;

      document.getElementById('stat-projects').setAttribute('value', active);
      document.getElementById('stat-tasks').setAttribute('value', open);
      document.getElementById('stat-content').setAttribute('value', week);
      document.getElementById('stat-blocked').setAttribute('value', blocked);
    } catch (_) {
      // Data not yet populated — stats stay at default —
    }
  }

  loadStats();
</script>

</body>
</html>
