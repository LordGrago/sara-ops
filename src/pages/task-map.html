<!DOCTYPE html>

<head>

  <style>
    .task-map-container {
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
      padding: var(--space-lg);
      height: 100%;
      overflow: hidden;
    }

    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-md);
    }

    .map-controls {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    .map-canvas {
      flex: 1;
      background-color: var(--color-bg-secondary);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      position: relative;
      overflow: auto;
      padding: var(--space-lg);
      min-height: 400px;
    }

    .task-node {
      position: absolute;
      background: var(--color-bg-primary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      width: 220px;
      box-shadow: var(--shadow-md);
      cursor: grab;
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 2;
    }

    .task-node:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      z-index: 10;
      border-color: var(--color-primary);
    }

    .task-node:active {
      cursor: grabbing;
    }

    .task-node.priority-high {
      border-left: 4px solid var(--color-error);
    }

    .task-node.priority-medium {
      border-left: 4px solid var(--color-warning);
    }

    .task-node.priority-low {
      border-left: 4px solid var(--color-success);
    }

    .task-title {
      font-weight: 600;
      font-size: var(--font-size-sm);
      margin-bottom: var(--space-xs);
      color: var(--color-text-primary);
      line-height: 1.4;
    }

    .task-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-xs);
    }

    .task-status {
      display: inline-block;
      padding: 2px 6px;
      border-radius: var(--radius-full);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-todo { background: var(--color-bg-tertiary); color: var(--color-text-secondary); }
    .status-progress { background: var(--color-info-light); color: var(--color-info); }
    .status-review { background: var(--color-warning-light); color: var(--color-warning); }
    .status-done { background: var(--color-success-light); color: var(--color-success); }

    .task-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 10px;
      padding: 2px 6px;
      background: var(--color-bg-tertiary);
      border-radius: var(--radius-full);
      color: var(--color-text-secondary);
    }

    .connection-line {
      position: absolute;
      height: 2px;
      background: var(--color-border);
      transform-origin: 0 50%;
      z-index: 1;
      pointer-events: none;
    }

    .legend {
      display: flex;
      gap: var(--space-md);
      padding: var(--space-sm);
      background: var(--color-bg-primary);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: var(--radius-sm);
    }
  </style>
</head>

    <!-- Main Content -->
    <main class="main-content">
      <div class="task-map-container">

          </div>
          
          <div class="map-controls">
            <button class="btn btn-secondary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <button class="btn btn-secondary">

            </button>
            <button class="btn btn-primary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        </div>

        <div class="legend">
          <div class="legend-item">
            <div class="legend-color" style="background: var(--color-error);"></div>
            <span>Высокий приоритет</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: var(--color-warning);"></div>

          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: var(--color-success);"></div>
            <span>Низкий приоритет</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: var(--color-info);"></div>
            <span>В работе</span>
          </div>
          <div class="legend-item">

        <div class="map-canvas" id="taskMapCanvas">
          <!-- Задачи будут добавлены через JS -->

  <script>
    // Моковые данные задач
    const tasks = [
      {
        id: 1,
        title: "Разработка дизайна лендинга",
        status: "progress",
        priority: "high",
        tags: ["design", "web"],
        x: 50,
        y: 50,
        connections: [2, 3]
      },
      {
        id: 2,
        title: "Написание контента для блога",
        status: "todo",
        priority: "medium",
        tags: ["content", "marketing"],
        x: 350,
        y: 80,
        connections: [4]
      },
      {
        id: 3,
        title: "Интеграция аналитики",
        status: "review",
        priority: "high",
        tags: ["dev", "analytics"],
        x: 50,
        y: 250,
        connections: [5]
      },
      {
        id: 4,
        title: "Создание превью для видео",
        status: "done",
        priority: "low",
        tags: ["visual", "video"],
        x: 350,
        y: 280,
        connections: []
      },
      {
        id: 5,
        title: "Подготовка отчета за месяц",
        status: "progress",
        priority: "medium",
        tags: ["reporting", "admin"],
        x: 650,
        y: 150,
        connections: []
      },
      {
        id: 6,
        title: "Обновление брендбука",
        status: "todo",
        priority: "high",
        tags: ["brand", "design"],
        x: 200,
        y: 400,
        connections: [1, 7]
      },
      {
        id: 7,
        title: "Фотосессия продукции",
        status: "review",
        priority: "medium",
        tags: ["photo", "production"],
        x: 500,
        y: 380,
        connections: [4]
      },
      {
        id: 8,
        title: "Запуск рекламной кампании",
        status: "todo",
        priority: "high",
        tags: ["marketing", "ads"],
        x: 650,
        y: 350,
        connections: [2, 5]
      }
    ];

    const statusLabels = {
      todo: "К выполнению",
      progress: "В работе",
      review: "На проверке",
      done: "Готово"
    };

    function renderTaskMap() {
      const canvas = document.getElementById('taskMapCanvas');
      canvas.innerHTML = '';

      // Рисуем линии связей
      tasks.forEach(task => {
        task.connections.forEach(targetId => {
          const target = tasks.find(t => t.id === targetId);
          if (target) {
            drawConnection(canvas, task, target);
          }
        });
      });

      // Рисуем узлы задач
      tasks.forEach(task => {
        const node = document.createElement('div');
        node.className = `task-node priority-${task.priority}`;
        node.style.left = `${task.x}px`;
        node.style.top = `${task.y}px`;
        node.dataset.id = task.id;

        node.innerHTML = `
          <div class="task-title">${task.title}</div>
          <div class="task-meta">
            <span class="task-status status-${task.status}">${statusLabels[task.status]}</span>
            <span>#${task.id}</span>
          </div>
          <div class="task-tags">
            ${task.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        `;

        // Простая реализация перетаскивания
        makeDraggable(node, task);
        canvas.appendChild(node);
      });
    }

    function drawConnection(canvas, fromTask, toTask) {
      const line = document.createElement('div');
      line.className = 'connection-line';
      
      const startX = fromTask.x + 220; // правый край источника
      const startY = fromTask.y + 60;  // середина по вертикали
      const endX = toTask.x;           // левый край цели
      const endY = toTask.y + 60;      // середина по вертикали

      const length = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
      const angle = Math.atan2(endY - startY, endX - startX) * 180 / Math.PI;

      line.style.width = `${length}px`;
      line.style.left = `${startX}px`;
      line.style.top = `${startY}px`;
      line.style.transform = `rotate(${angle}deg)`;

      canvas.appendChild(line);
    }

    function makeDraggable(element, taskData) {
      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      element.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = parseInt(element.style.left || 0);
        initialTop = parseInt(element.style.top || 0);
        element.style.zIndex = 100;
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        
        element.style.left = `${initialLeft + dx}px`;
        element.style.top = `${initialTop + dy}px`;
        
        // Обновляем координаты в данных
        taskData.x = initialLeft + dx;
        taskData.y = initialTop + dy;
        
        // Перерисовываем связи
        renderTaskMap();
      });

      document.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          element.style.zIndex = '';
        }
      });
    }

    // Инициализация
    renderTaskMap();
  </script>
</body>
